<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhatsApp Web - Login</title>

    <link rel="stylesheet" href="/templates/css/login.css">
</head>

<body>

<div class="page">

    <div class="auth-container">

        <!-- LEFT WHATSAPP PANEL -->
        <section class="brand-panel">

            <div class="whatsapp-logo">
                <span>☎</span>
            </div>

            <h1>WhatsApp Web</h1>

            <p>
                Simple, secure and reliable messaging.
            </p>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </section>


        <!-- LOGIN PANEL -->
        <section class="login-panel">

            <div class="mobile-brand">
                <div class="mobile-logo">☎</div>
                <span>WhatsApp</span>
            </div>

            <div class="heading">

                <h2>Welcome back</h2>

                <p>
                    Login to continue to your account
                </p>

            </div>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                    >

                    <small id="emailError"></small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                        >

                        <button
                                type="button"
                                id="togglePassword"
                        >
                            Show
                        </button>

                    </div>

                    <small id="passwordError"></small>

                </div>


                <!-- CAPTCHA -->

                <div class="captcha-container">

                    <div class="captcha-header">

                        <span>
                            Security check
                        </span>

                        <button
                                type="button"
                                id="refreshCaptcha"
                        >
                            ↻
                        </button>

                    </div>


                    <div class="captcha-image-container">

                        <img
                                id="captchaImage"
                                alt="CAPTCHA"
                        >

                        <span id="captchaLoading">
                            Loading...
                        </span>

                    </div>


                    <input
                            type="text"
                            id="captchaAnswer"
                            placeholder="Enter the characters shown above"
                            autocomplete="off"
                            required
                    >

                    <input
                            type="hidden"
                            id="captchaId"
                    >

                    <small id="captchaError"></small>

                </div>


                <!-- MESSAGE -->

                <div
                        id="message"
                        class="message"
                ></div>


                <!-- LOGIN BUTTON -->

                <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                >

                    <span id="buttonText">
                        Login
                    </span>

                    <span
                            id="spinner"
                            class="spinner"
                    ></span>

                </button>

            </form>


            <div class="switch-account">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>

        </section>

    </div>

</div>

<script src="/templates/js/login.js"></script>

</body>
</html>
