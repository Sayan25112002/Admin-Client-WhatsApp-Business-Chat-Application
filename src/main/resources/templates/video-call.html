<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Video Call</title>
    <style>
        *{box-sizing:border-box}
        html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#111b21;color:#fff}
        body{display:flex;flex-direction:column}
        .call-header{height:64px;background:#202c33;display:flex;align-items:center;padding:0 20px;flex-shrink:0;border-bottom:1px solid #344047}
        .call-info{display:flex;align-items:center;gap:12px;min-width:0}
        .call-avatar{width:42px;height:42px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;flex-shrink:0}
        .call-title{min-width:0}
        .call-title strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .call-title span{display:block;color:#aebac1;font-size:12px;margin-top:3px}
        .call-type{margin-left:auto;color:#aebac1;font-size:12px}
        .video-area{flex:1;position:relative;overflow:hidden;background:#0b141a;padding:16px}
        .video-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));grid-auto-rows:minmax(220px,1fr);gap:12px;align-items:center;justify-items:center}
        .video-card{position:relative;width:100%;height:100%;min-height:220px;background:#202c33;border-radius:10px;overflow:hidden;border:1px solid #344047}
        .video-card video{width:100%;height:100%;object-fit:cover;display:block;background:#111}
        .video-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#202c33}
        .placeholder-avatar{width:90px;height:90px;border-radius:50%;background:#128c7e;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:bold}
        .video-label{position:absolute;left:12px;bottom:10px;padding:6px 9px;border-radius:5px;background:rgba(0,0,0,.55);font-size:12px;max-width:75%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .video-status{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:14px}
        .local-video{position:absolute;right:24px;bottom:24px;width:220px;height:145px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.35);background:#202c33;z-index:5;box-shadow:0 5px 20px rgba(0,0,0,.4)}
        .local-video video{width:100%;height:100%;object-fit:cover;display:block}
        .local-label{position:absolute;left:8px;bottom:7px;background:rgba(0,0,0,.55);padding:4px 7px;border-radius:4px;font-size:11px}
        .waiting-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#0b141a;z-index:2}
        .waiting-icon{width:90px;height:90px;border-radius:50%;background:#128c7e;display:flex;align-items:center;justify-content:center;font-size:38px}
        .waiting-title{font-size:18px;font-weight:bold}
        .waiting-text{color:#aebac1;font-size:13px;text-align:center;padding:0 15px}
        .call-controls{height:90px;background:#202c33;display:flex;justify-content:center;align-items:center;gap:18px;flex-shrink:0;border-top:1px solid #344047}
        .control-btn{width:52px;height:52px;border:0;border-radius:50%;background:#3b4a52;color:#fff;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
        .control-btn:hover{background:#52636c}
        .control-btn.active{background:#667781}
        .control-btn.muted{background:#ea0038}
        .end-call{width:58px;height:52px;border:0;border-radius:26px;background:#ea0038;color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .end-call:hover{background:#c90030}
        .status-bar{position:absolute;top:78px;left:50%;transform:translateX(-50%);z-index:10;padding:7px 14px;border-radius:18px;background:rgba(32,44,51,.85);color:#d9e1e5;font-size:12px;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
        .connection-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#25d366;margin-right:5px}
        .connection-dot.disconnected{background:#ea0038}
        .participant-count{position:absolute;left:20px;bottom:24px;z-index:6;background:rgba(0,0,0,.55);padding:7px 11px;border-radius:16px;color:#d9e1e5;font-size:12px}
        @media(max-width:800px){
            .video-area{padding:8px}
            .video-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
            .video-card{min-height:170px}
            .local-video{width:145px;height:100px;right:12px;bottom:15px}
            .participant-count{left:12px;bottom:15px}
            .call-controls{height:80px;gap:12px}
            .control-btn{width:46px;height:46px;font-size:18px}
            .end-call{width:52px;height:46px}
        }
        @media(max-width:500px){
            .call-header{height:58px;padding:0 12px}
            .call-avatar{width:36px;height:36px}
            .call-title strong{font-size:14px}
            .call-type{display:none}
            .video-area{padding:5px}
            .video-grid{grid-template-columns:1fr;grid-auto-rows:1fr}
            .video-card{min-height:160px}
            .local-video{width:120px;height:85px;right:8px;bottom:10px}
            .participant-count{left:8px;bottom:10px}
            .call-controls{height:75px;gap:8px}
            .control-btn{width:42px;height:42px}
            .end-call{width:48px;height:42px}
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<header class="call-header">
    <div class="call-info">
        <div class="call-avatar" id="callAvatar">👥</div>
        <div class="call-title">
            <strong id="callTitle">Public Group</strong>
            <span id="callSubtitle">Connecting...</span>
        </div>
    </div>
    <div class="call-type" id="callType">Group video call</div>
</header>
<main class="video-area">
    <div class="status-bar" id="connectionStatus"><span class="connection-dot disconnected"></span> Connecting...</div>
    <div class="video-grid" id="videoGrid"></div>
    <div class="waiting-screen" id="waitingScreen">
        <div class="waiting-icon" id="waitingIcon">👥</div>
        <div class="waiting-title" id="waitingTitle">Starting video call</div>
        <div class="waiting-text" id="waitingText">Please wait...</div>
    </div>
    <div class="local-video">
        <video id="localVideo" autoplay muted playsinline></video>
        <div class="local-label" id="localLabel">You</div>
    </div>
    <div class="participant-count" id="participantCount">1 participant</div>
</main>
<footer class="call-controls">
    <button class="control-btn" id="micButton" title="Mute microphone" onclick="toggleMicrophone()">🎤</button>
    <button class="control-btn" id="cameraButton" title="Turn off camera" onclick="toggleCamera()">📹</button>
    <button class="end-call" title="Leave call" onclick="endCall()">📞</button>
</footer>
<script>
    "use strict";

    /* Configuration and session information */
    const API_BASE_URL="http://localhost:8080";
    const videoCallMode=sessionStorage.getItem("videoCallMode")||"group";
    const callMode=sessionStorage.getItem("callMode")||"start";
    const currentUserId=Number(sessionStorage.getItem("callUserId")||sessionStorage.getItem("userId"));
    const currentUserName=sessionStorage.getItem("callUserName")||sessionStorage.getItem("userName")||"You";
    const peerId=Number(sessionStorage.getItem("videoCallPeerId"))||null;
    const peerName=sessionStorage.getItem("videoCallPeerName")||"User";
    let accessToken=sessionStorage.getItem("accessToken");
    const REFRESH_TOKEN_URL=API_BASE_URL+"/refresh-token/";
    const isIncomingCall=callMode==="accept"||callMode==="join";
    const isPrivateCall=videoCallMode==="private";
    const callTypeValue=isPrivateCall?"PRIVATE":"GROUP";
    let callId=sessionStorage.getItem("callId");
    let originalCallerId=Number(sessionStorage.getItem("callCallerId"))||null;
    if(!callId&&!isIncomingCall){
        callId=window.crypto&&crypto.randomUUID?crypto.randomUUID():"call-"+currentUserId+"-"+Date.now();
        sessionStorage.setItem("callId",callId);
    }
    if(!originalCallerId&&!isIncomingCall)originalCallerId=currentUserId;

    const callTitle=document.getElementById("callTitle");
    const callSubtitle=document.getElementById("callSubtitle");
    const callType=document.getElementById("callType");
    const callAvatar=document.getElementById("callAvatar");
    const waitingIcon=document.getElementById("waitingIcon");
    const waitingTitle=document.getElementById("waitingTitle");
    const waitingText=document.getElementById("waitingText");
    const localLabel=document.getElementById("localLabel");

    if(isPrivateCall){
        callTitle.textContent=peerName;
        callSubtitle.textContent=isIncomingCall?"Joining call with "+peerName:"Private video call";
        callType.textContent="Private video call";
        callAvatar.textContent=peerName.charAt(0).toUpperCase();
        waitingIcon.textContent=peerName.charAt(0).toUpperCase();
        waitingTitle.textContent=isIncomingCall?"Joining "+peerName:"Calling "+peerName;
        waitingText.textContent="Waiting for the other participant...";
    }else{
        callTitle.textContent="Public Group";
        callSubtitle.textContent="Group video call";
        callType.textContent="Group video call";
        callAvatar.textContent="👥";
        waitingIcon.textContent="👥";
        waitingTitle.textContent=isIncomingCall?"Joining group video call":"Starting group video call";
        waitingText.textContent="Waiting for participants...";
    }
    localLabel.textContent=currentUserName;

    /* WebRTC and media state */
    const ICE_CONFIG={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
    let localStream=null;
    let cameraError=null;
    let stompClient=null;
    let microphoneEnabled=true;
    let cameraEnabled=true;
    let endingCall=false;
    let callStarted=false;
    const remoteParticipants=new Map();
    const peerConnections=new Map();
    const pendingCandidates=new Map();
    const offerCreated=new Set();

    function setConnectionStatus(connected,message){
        const status=document.getElementById("connectionStatus");
        const dot=status.querySelector(".connection-dot");
        dot.classList.toggle("disconnected",!connected);
        status.replaceChildren(dot,document.createTextNode(" "+(message||(connected?"Connected":"Disconnected"))));
    }

    function cameraErrorReason(){
        const name=cameraError&&cameraError.name;
        if(name==="NotReadableError"||name==="AbortError")return "the camera is already in use by another browser or app";
        if(name==="NotAllowedError"||name==="SecurityError")return "camera permission is blocked for this page";
        if(name==="NotFoundError"||name==="OverconstrainedError")return "no camera was found";
        return name||"unknown error";
    }

    async function startLocalMedia(){
        try{
            localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});
        }catch(error){
            console.warn("Camera and microphone access failed; trying microphone only.",error);
            cameraError=error;
            try{
                localStream=await navigator.mediaDevices.getUserMedia({video:false,audio:true});
                cameraEnabled=false;
                const button=document.getElementById("cameraButton");
                button.textContent="🚫";
                button.title="Camera unavailable";
                button.classList.add("muted");
                waitingText.textContent="Camera unavailable ("+cameraErrorReason()+"). Connecting with microphone only...";
            }catch(audioError){
                console.error("Media access error:",audioError);
                waitingTitle.textContent="Camera/microphone access required";
                waitingText.textContent="Allow camera and microphone permissions, then reload this page.";
                setConnectionStatus(false,"Media permission denied");
                return false;
            }
        }
        document.getElementById("localVideo").srcObject=localStream;
        return true;
    }

    function toggleMicrophone(){
        if(!localStream)return;
        const tracks=localStream.getAudioTracks();
        if(!tracks.length)return;
        microphoneEnabled=!microphoneEnabled;
        tracks.forEach(track=>track.enabled=microphoneEnabled);
        const button=document.getElementById("micButton");
        button.textContent=microphoneEnabled?"🎤":"🔇";
        button.title=microphoneEnabled?"Mute microphone":"Unmute microphone";
        button.classList.toggle("muted",!microphoneEnabled);
    }

    function toggleCamera(){
        if(!localStream)return;
        const tracks=localStream.getVideoTracks();
        if(!tracks.length){
            alert("No camera video track is available: "+cameraErrorReason()+".");
            return;
        }
        cameraEnabled=!cameraEnabled;
        tracks.forEach(track=>track.enabled=cameraEnabled);
        const button=document.getElementById("cameraButton");
        button.textContent=cameraEnabled?"📹":"🚫";
        button.title=cameraEnabled?"Turn off camera":"Turn on camera";
        button.classList.toggle("muted",!cameraEnabled);
    }

    function createParticipantVideo(participantId,participantName){
        participantId=Number(participantId);
        if(!Number.isFinite(participantId)||participantId===currentUserId)return null;
        if(remoteParticipants.has(participantId)){
            const existing=remoteParticipants.get(participantId);
            if(participantName){
                existing.name=participantName;
                existing.label.textContent=participantName;
                existing.avatar.textContent=participantName.charAt(0).toUpperCase();
            }
            return existing;
        }
        const card=document.createElement("div");
        card.className="video-card";
        card.id="participant-"+participantId;

        const placeholder=document.createElement("div");
        placeholder.className="video-placeholder";
        const avatar=document.createElement("div");
        avatar.className="placeholder-avatar";
        avatar.textContent=(participantName||"?").charAt(0).toUpperCase();
        placeholder.appendChild(avatar);

        const video=document.createElement("video");
        video.autoplay=true;
        video.playsInline=true;
        video.muted=false;
        video.setAttribute("playsinline","");

        const label=document.createElement("div");
        label.className="video-label";
        label.textContent=participantName||("User "+participantId);

        const status=document.createElement("div");
        status.className="video-status";
        status.textContent="🎤";

        card.append(placeholder,video,label,status);
        document.getElementById("videoGrid").appendChild(card);

        const participant={id:participantId,name:participantName||("User "+participantId),card,video,placeholder,label,avatar,status,stream:null};
        remoteParticipants.set(participantId,participant);
        updateParticipantCount();
        updateWaitingScreen();
        return participant;
    }

    function removeParticipant(participantId){
        participantId=Number(participantId);
        const participant=remoteParticipants.get(participantId);
        if(participant){
            participant.video.srcObject=null;
            participant.card.remove();
            remoteParticipants.delete(participantId);
        }
        const pc=peerConnections.get(participantId);
        if(pc){
            pc.onicecandidate=null;
            pc.ontrack=null;
            pc.close();
            peerConnections.delete(participantId);
        }
        pendingCandidates.delete(participantId);
        offerCreated.delete(participantId);
        updateParticipantCount();
        updateWaitingScreen();
    }

    function setRemoteStream(participantId,stream){
        const participant=remoteParticipants.get(Number(participantId));
        if(!participant)return;
        participant.stream=stream;
        if(participant.video.srcObject===stream)return;
        participant.video.srcObject=stream;
        participant.video.style.display="block";
        participant.placeholder.style.display="none";
        participant.video.play().catch(error=>{if(error&&error.name==="AbortError")return;console.warn("Remote video autoplay was blocked; click the page to enable playback.",error);document.addEventListener("click",()=>participant.video.play().catch(()=>{}),{once:true});});
    }

    function updateParticipantCount(){
        const count=remoteParticipants.size+1;
        document.getElementById("participantCount").textContent=count+" participant"+(count===1?"":"s");
    }

    function updateWaitingScreen(){
        document.getElementById("waitingScreen").style.display=remoteParticipants.size>0?"none":"flex";
    }

    /* The server DTOs carry offer/answer/candidate as Strings, so they travel as JSON text. */
    function parseSignal(value){return typeof value==="string"?JSON.parse(value):value;}

    /* STOMP helpers */
    function sendMessage(destination,payload){
        if(!stompClient||!stompClient.connected){
            console.warn("Cannot send STOMP message while disconnected:",destination);
            return false;
        }
        stompClient.send(destination,{},JSON.stringify(payload));
        return true;
    }

    function onlinePayload(){
        return {
            callerId:currentUserId,
            callerName:currentUserName,
            callId:callId,
            callType:callTypeValue,
            receiverId:isPrivateCall?peerId:null
        };
    }

    function connectWebSocket(){
        return new Promise((resolve,reject)=>{
            if(typeof SockJS==="undefined"||typeof Stomp==="undefined"){
                reject(new Error("SockJS or STOMP library did not load."));
                return;
            }
            const socket=new SockJS(API_BASE_URL+"/ws");
            stompClient=Stomp.over(socket);
            stompClient.debug=null;
            const headers=accessToken?{Authorization:"Bearer "+accessToken}:{};
            stompClient.connect(headers,()=>{
                setConnectionStatus(true,"Signaling connected");
                stompClient.subscribe("/topic/call/"+currentUserId,message=>{
                    try{
                        handleCallSignal(JSON.parse(message.body)).catch(error=>console.error("Call signal handling failed:",error));
                    }catch(error){
                        console.error("Invalid call message:",error,message.body);
                    }
                });
                resolve();
            },error=>{
                console.error("STOMP connection error:",error);
                setConnectionStatus(false,"Signaling connection failed");
                reject(error instanceof Error?error:new Error("Could not connect to the call server."));
            });
        });
    }

    /* Call lifecycle */
    async function startOrJoinCall(){
        if(!Number.isFinite(currentUserId)||currentUserId<=0){
            throw new Error("User ID is missing. Please log in again.");
        }
        if(isIncomingCall&&!callId){
            throw new Error("The incoming call ID is missing. Return to groupchat.html and accept the call again.");
        }
        if(isPrivateCall&&!isIncomingCall&&(!peerId||peerId===currentUserId)){
            throw new Error("The private-call recipient is missing or invalid.");
        }

        await connectWebSocket();

        /* Register this user as online before starting or accepting the call. */
        sendMessage("/app/call.online",onlinePayload());

        if(isIncomingCall){
            const callerId=originalCallerId||peerId;
            if(!callerId)throw new Error("The original caller ID is missing.");
            sendMessage("/app/call.accept",{
                callId:callId,
                callerId:callerId,
                acceptorId:currentUserId
            });
            callStarted=true;
            callSubtitle.textContent="Joining call...";
            setConnectionStatus(true,"Joining call...");
            return;
        }

        sendMessage("/app/call.start",{
            callId:callId,
            callerId:currentUserId,
            callerName:currentUserName,
            callType:callTypeValue,
            receiverId:isPrivateCall?peerId:null
        });
        callStarted=true;
        sessionStorage.setItem("callId",callId);
        sessionStorage.setItem("callCallerId",String(currentUserId));
        callSubtitle.textContent=isPrivateCall?"Calling "+peerName:"Waiting for participants...";
        setConnectionStatus(true,isPrivateCall?"Calling participant":"Waiting for participants");
    }

    /* WebRTC peer connections */
    function createPeerConnection(participantId,participantName){
        participantId=Number(participantId);
        if(peerConnections.has(participantId))return peerConnections.get(participantId);
        if(!localStream)throw new Error("Local media is not ready.");

        createParticipantVideo(participantId,participantName);
        const pc=new RTCPeerConnection(ICE_CONFIG);
        localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));

        pc.onicecandidate=event=>{
            if(event.candidate){
                sendMessage("/app/call.ice",{
                    callId:callId,
                    senderId:currentUserId,
                    receiverId:participantId,
                    candidate:JSON.stringify(event.candidate)
                });
            }
        };

        pc.ontrack=event=>{
            let stream=event.streams&&event.streams[0];
            if(!stream){
                stream=new MediaStream();
                stream.addTrack(event.track);
            }
            setRemoteStream(participantId,stream);
        };

        pc.onconnectionstatechange=()=>{
            console.log("Peer connection",participantId,pc.connectionState);
            if(pc.connectionState==="connected"){
                setConnectionStatus(true,"Audio/video connected");
            }else if(pc.connectionState==="failed"){
                setConnectionStatus(false,"Connection failed; network may require TURN");
            }else if(pc.connectionState==="disconnected"){
                setConnectionStatus(false,"Participant connection interrupted");
            }
        };

        pc.oniceconnectionstatechange=()=>{
            if(pc.iceConnectionState==="failed"){
                console.warn("ICE failed for user",participantId,"A TURN server may be required.");
            }
        };

        peerConnections.set(participantId,pc);
        pendingCandidates.set(participantId,pendingCandidates.get(participantId)||[]);
        return pc;
    }

    async function createOffer(participantId,participantName){
        participantId=Number(participantId);
        if(participantId===currentUserId||currentUserId>participantId)return;
        if(offerCreated.has(participantId))return;
        const pc=createPeerConnection(participantId,participantName);
        if(pc.signalingState!=="stable")return;
        offerCreated.add(participantId);
        try{
            const offer=await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendMessage("/app/call.offer",{
                callId:callId,
                senderId:currentUserId,
                receiverId:participantId,
                offer:JSON.stringify(pc.localDescription)
            });
        }catch(error){
            offerCreated.delete(participantId);
            console.error("Could not create offer for user",participantId,error);
        }
    }

    async function flushPendingCandidates(participantId,pc){
        const candidates=pendingCandidates.get(Number(participantId))||[];
        while(candidates.length){
            const candidate=candidates.shift();
            try{
                await pc.addIceCandidate(new RTCIceCandidate(parseSignal(candidate)));
            }catch(error){
                console.warn("Could not add queued ICE candidate:",error);
            }
        }
    }

    async function handleOffer(data){
        const senderId=Number(data.senderId);
        if(!senderId||senderId===currentUserId||!data.offer)return;
        const pc=createPeerConnection(senderId,"User "+senderId);
        await pc.setRemoteDescription(new RTCSessionDescription(parseSignal(data.offer)));
        await flushPendingCandidates(senderId,pc);
        const answer=await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendMessage("/app/call.answer",{
            callId:callId,
            senderId:currentUserId,
            receiverId:senderId,
            answer:JSON.stringify(pc.localDescription)
        });
    }

    async function handleAnswer(data){
        const senderId=Number(data.senderId);
        const pc=peerConnections.get(senderId);
        if(!pc||!data.answer)return;
        await pc.setRemoteDescription(new RTCSessionDescription(parseSignal(data.answer)));
        await flushPendingCandidates(senderId,pc);
    }

    async function handleIceCandidate(data){
        const senderId=Number(data.senderId);
        if(!senderId||senderId===currentUserId||!data.candidate)return;
        let pc=peerConnections.get(senderId);
        if(!pc){
            createPeerConnection(senderId,"User "+senderId);
            pc=peerConnections.get(senderId);
        }
        if(!pc.remoteDescription||!pc.remoteDescription.type){
            const candidates=pendingCandidates.get(senderId)||[];
            candidates.push(data.candidate);
            pendingCandidates.set(senderId,candidates);
            return;
        }
        try{
            await pc.addIceCandidate(new RTCIceCandidate(parseSignal(data.candidate)));
        }catch(error){
            console.warn("Could not add ICE candidate:",error);
        }
    }

    /* Messages sent by CallServiceImpl to /topic/call/{userId}. */
    async function handleCallSignal(data){
        if(!data)return;
        if(data.callId&&callId&&data.callId!==callId){
            console.debug("Ignoring signal for another call:",data.callId);
            return;
        }
        if(data.callId&&!callId){
            callId=data.callId;
            sessionStorage.setItem("callId",callId);
        }

        if(data.status==="PARTICIPANTS"&&data.participants){
            for(const [id,name] of Object.entries(data.participants)){
                const participantId=Number(id);
                if(participantId===currentUserId)continue;
                createParticipantVideo(participantId,name);
                if(currentUserId<participantId)await createOffer(participantId,name);
            }
        }

        if(data.status==="USER_JOINED"&&data.userId){
            const participantId=Number(data.userId);
            if(participantId!==currentUserId){
                createParticipantVideo(participantId,data.userName||("User "+participantId));
                if(currentUserId<participantId)await createOffer(participantId,data.userName);
            }
        }

        if(data.offer)await handleOffer(data);
        if(data.answer)await handleAnswer(data);
        if(data.candidate)await handleIceCandidate(data);

        if(data.status==="LEFT"&&data.callerId){
            removeParticipant(data.callerId);
        }

        if(data.status==="ENDED"){
            setConnectionStatus(false,"Call ended");
            waitingTitle.textContent="Call ended";
            waitingText.textContent="Returning to chat...";
            cleanupMedia();
            closePeerConnections();
            disconnectSocket();
            if(!endingCall){
                endingCall=true;
                setTimeout(()=>window.location.href="groupchat.html",500);
            }
        }

        if(data.status==="REJECTED"&&isPrivateCall){
            setConnectionStatus(false,"Call rejected");
            waitingTitle.textContent="Call rejected";
            waitingText.textContent=(data.userName||"The participant")+" rejected the call.";
        }

        if(data.status==="USER_OFFLINE"){
            setConnectionStatus(false,"User is offline");
            waitingTitle.textContent="User is offline";
            waitingText.textContent="The other participant is not currently online.";
        }

        if(data.status==="CALL_ACTIVE"){
            setConnectionStatus(false,"Call could not start");
            waitingTitle.textContent="Call already active";
            waitingText.textContent="A call with this ID already exists. Return to chat and try again.";
        }

        if(data.status==="NOT_ALLOWED"){
            setConnectionStatus(false,"Call not allowed");
            waitingTitle.textContent="Unable to join call";
            waitingText.textContent="You are not an intended participant in this private call.";
        }
    }

    function closePeerConnections(){
        peerConnections.forEach(pc=>{
            pc.onicecandidate=null;
            pc.ontrack=null;
            pc.close();
        });
        peerConnections.clear();
        pendingCandidates.clear();
        offerCreated.clear();
        remoteParticipants.forEach(participant=>{
            participant.video.srcObject=null;
            participant.card.remove();
        });
        remoteParticipants.clear();
        updateParticipantCount();
        updateWaitingScreen();
    }

    function disconnectSocket(){
        if(stompClient&&stompClient.connected){
            try{stompClient.disconnect(()=>console.log("Call signaling disconnected"));}catch(error){console.warn(error);}
        }
        stompClient=null;
    }

    function cleanupMedia(){
        if(localStream){
            localStream.getTracks().forEach(track=>track.stop());
            localStream=null;
        }
        const localVideo=document.getElementById("localVideo");
        if(localVideo)localVideo.srcObject=null;
        closePeerConnections();
    }

    function clearCallSession(){
        ["videoCallMode","callMode","videoCallPeerId","videoCallPeerName","videoCallPeerRole","callUserId","callUserName","callId","callCallerId"].forEach(key=>sessionStorage.removeItem(key));
    }

    function endCall(){
        if(endingCall)return;
        if(!confirm("Leave the video call?"))return;
        endingCall=true;
        if(callStarted&&callId&&stompClient&&stompClient.connected){
            const endForEveryone=isPrivateCall||(!isIncomingCall&&callMode==="start");
            sendMessage("/app/call.end",{
                callId:callId,
                userId:currentUserId,
                endForEveryone:endForEveryone
            });
        }
        cleanupMedia();
        disconnectSocket();
        clearCallSession();
        window.location.href="groupchat.html";
    }

    async function initializeCall(){
        setConnectionStatus(false,"Preparing camera and microphone");
        if(!Number.isFinite(currentUserId)||currentUserId<=0){
            waitingTitle.textContent="Login required";
            waitingText.textContent="Your user ID was not found. Please log in again.";
            setConnectionStatus(false,"User ID missing");
            return;
        }
        if(isIncomingCall&&!callId){
            waitingTitle.textContent="Call information missing";
            waitingText.textContent="The call ID was not provided. Return to chat and accept the call again.";
            setConnectionStatus(false,"Call ID missing");
            return;
        }
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
            waitingTitle.textContent="Media access unavailable";
            waitingText.textContent="Open this page through localhost or HTTPS and allow browser camera/microphone access.";
            setConnectionStatus(false,"Browser media unavailable");
            return;
        }

        const mediaReady=await startLocalMedia();
        if(!mediaReady)return;

        try{
            await startOrJoinCall();
        }catch(error){
            console.error("Could not initialize call:",error);
            setConnectionStatus(false,"Could not connect to call server");
            waitingTitle.textContent="Unable to connect";
            waitingText.textContent=error.message||"Check the Spring Boot server, WebSocket endpoint, and login session.";
        }
    }

    window.addEventListener("beforeunload",()=>{
        if(localStream)localStream.getTracks().forEach(track=>track.stop());
        peerConnections.forEach(pc=>pc.close());
        if(stompClient&&stompClient.connected){
            try{stompClient.disconnect(()=>{});}catch(error){}
        }
    });

    initializeCall();
</script>
