<script>
    const API_BASE_URL = "http://localhost:8080";

    const registerForm = document.getElementById("registerForm");
    const nameInput = document.getElementById("name");
    const contactInput = document.getElementById("contact");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const captchaImage = document.getElementById("captchaImage");
    const captchaAnswerInput = document.getElementById("captchaAnswer");
    const refreshCaptchaButton = document.getElementById("refreshCaptchaButton");
    const generateOtpButton = document.getElementById("generateOtpButton");
    const otpSection = document.getElementById("otpSection");
    const emailOtpInput = document.getElementById("emailOtp");
    const verifyEmailOtpButton = document.getElementById("verifyEmailOtpButton");
    const emailVerificationStatus = document.getElementById("emailVerificationStatus");
    const registerButton = document.getElementById("registerButton");
    const message = document.getElementById("message");

    let captchaId = null;
    let verificationId = null;
    let emailVerified = false;

    document.addEventListener("DOMContentLoaded", () => {
        generateCaptcha();
    });

    async function generateCaptcha() {
        try {
            message.textContent = "";

            const response = await fetch(
                `${API_BASE_URL}/generateImageCaptcha`,
                {
                    method: "GET"
                }
            );

            if (!response.ok) {
                throw new Error(
                    `CAPTCHA generation failed: ${response.status}`
                );
            }

            const data = await response.json();

            console.log("CAPTCHA Response:", data);

            captchaId = data.captchaId;
            captchaImage.src = data.captchaImage;
            captchaAnswerInput.value = "";

        } catch (error) {
            console.error("CAPTCHA Error:", error);

            showMessage(
                "Unable to generate CAPTCHA.",
                false
            );
        }
    }

    refreshCaptchaButton.addEventListener(
        "click",
        generateCaptcha
    );

    generateOtpButton.addEventListener(
        "click",
        async () => {

            const name = nameInput.value.trim();
            const contact = contactInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const captchaAnswer = captchaAnswerInput.value.trim();

            if (!name) {
                showMessage(
                    "Please enter your name.",
                    false
                );
                return;
            }

            if (!contact) {
                showMessage(
                    "Please enter your contact number.",
                    false
                );
                return;
            }

            if (!email) {
                showMessage(
                    "Please enter your email.",
                    false
                );
                return;
            }

            if (!password) {
                showMessage(
                    "Please enter your password.",
                    false
                );
                return;
            }

            if (!captchaAnswer) {
                showMessage(
                    "Please enter the CAPTCHA.",
                    false
                );
                return;
            }

            if (!captchaId) {
                showMessage(
                    "CAPTCHA is not available. Please refresh it.",
                    false
                );
                return;
            }

            try {
                generateOtpButton.disabled = true;
                generateOtpButton.textContent = "Generating OTP...";

                const captchaResponse = await fetch(
                    `${API_BASE_URL}/validateCaptcha` +
                    `?captchaId=${encodeURIComponent(captchaId)}` +
                    `&captchaAnswer=${encodeURIComponent(captchaAnswer)}`,
                    {
                        method: "POST"
                    }
                );

                if (!captchaResponse.ok) {
                    throw new Error("Invalid CAPTCHA.");
                }

                const otpResponse = await fetch(
                    `${API_BASE_URL}/generateOtp` +
                    `?email=${encodeURIComponent(email)}`,
                    {
                        method: "POST"
                    }
                );

                if (!otpResponse.ok) {
                    const errorText = await otpResponse.text();

                    throw new Error(
                        errorText ||
                        "Unable to generate OTP."
                    );
                }

                verificationId = await otpResponse.text();

                verificationId = verificationId.replace(
                    /^"|"$/g,
                    ""
                );

                console.log(
                    "Verification ID:",
                    verificationId
                );

                otpSection.classList.remove("hidden");

                showMessage(
                    "OTP generated successfully. Check your email.",
                    true
                );

                generateOtpButton.disabled = true;

            } catch (error) {
                console.error("OTP Error:", error);

                showMessage(
                    error.message,
                    false
                );

                generateOtpButton.disabled = false;

            } finally {
                generateOtpButton.textContent = "Generate OTP";
            }
        }
    );

    verifyEmailOtpButton.addEventListener(
        "click",
        async () => {

            const otp = emailOtpInput.value.trim();

            if (!verificationId) {
                setVerificationStatus(
                    emailVerificationStatus,
                    "Please generate OTP first.",
                    false
                );
                return;
            }

            if (!otp) {
                setVerificationStatus(
                    emailVerificationStatus,
                    "Please enter email OTP.",
                    false
                );
                return;
            }

            try {
                verifyEmailOtpButton.disabled = true;
                verifyEmailOtpButton.textContent = "Verifying...";

                const response = await fetch(
                    `${API_BASE_URL}/validateEmailOtp` +
                    `?verificationId=${encodeURIComponent(verificationId)}` +
                    `&otp=${encodeURIComponent(otp)}`,
                    {
                        method: "POST"
                    }
                );

                if (!response.ok) {
                    const errorText = await response.text();

                    throw new Error(
                        errorText ||
                        "Invalid email OTP."
                    );
                }

                emailVerified = true;

                setVerificationStatus(
                    emailVerificationStatus,
                    "✓ Email verified",
                    true
                );

                verifyEmailOtpButton.disabled = true;
                emailOtpInput.disabled = true;

                updateRegisterButton();

            } catch (error) {
                console.error(
                    "Email OTP Error:",
                    error
                );

                setVerificationStatus(
                    emailVerificationStatus,
                    error.message ||
                    "Invalid email OTP.",
                    false
                );

                verifyEmailOtpButton.disabled = false;

            } finally {
                verifyEmailOtpButton.textContent = "Verify";
            }
        }
    );

    function updateRegisterButton() {
        registerButton.disabled = !emailVerified;
    }

    registerForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            if (!emailVerified) {
                showMessage(
                    "Please verify your email.",
                    false
                );
                return;
            }

            if (!verificationId) {
                showMessage(
                    "Verification ID is missing.",
                    false
                );
                return;
            }

            const registerData = {
                name: nameInput.value.trim(),
                contact: contactInput.value.trim(),
                email: emailInput.value.trim(),
                password: passwordInput.value,
                captchaId: captchaId,
                captchaAnswer: captchaAnswerInput.value.trim(),
                verificationId: verificationId
            };

            console.log(
                "Register Request:",
                registerData
            );

            try {
                registerButton.disabled = true;
                registerButton.textContent = "Registering...";

                const response = await fetch(
                    `${API_BASE_URL}/auth/register`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(registerData)
                    }
                );

                const responseText = await response.text();

                if (!response.ok) {
                    throw new Error(
                        responseText ||
                        "Registration failed."
                    );
                }

                let data;

                try {
                    data = JSON.parse(responseText);
                } catch {
                    data = {
                        message: responseText
                    };
                }

                console.log(
                    "Registration Response:",
                    data
                );

                showMessage(
                    data.message ||
                    "Registration successful. Redirecting to login...",
                    true
                );

                setTimeout(
                    () => {
                        sessionStorage.removeItem("allowRegister");
                        window.location.href = "login.html";
                    },
                    1500
                );

            } catch (error) {
                console.error(
                    "Registration Error:",
                    error
                );

                showMessage(
                    error.message ||
                    "Registration failed.",
                    false
                );

                registerButton.disabled = false;

            } finally {
                registerButton.textContent = "Register";
            }
        }
    );

    function showMessage(text, success) {
        message.textContent = text;
        message.className = "message";

        if (success) {
            message.classList.add("message-success");
        } else {
            message.classList.add("message-error");
        }
    }

    function setVerificationStatus(
        element,
        text,
        success
    ) {
        element.textContent = text;
        element.className = "verification-status";

        if (success) {
            element.classList.add("verification-success");
        } else {
            element.classList.add("verification-error");
        }
    }
</script>
