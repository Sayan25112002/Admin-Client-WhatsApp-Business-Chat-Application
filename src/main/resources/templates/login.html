<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>WhatsApp Web - Login</title>


    <!-- ======================================================
         CSS
         ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --whatsapp-green: #00a884;
            --whatsapp-dark-green: #008f72;
            --whatsapp-dark: #111b21;
            --whatsapp-text: #3b4a54;
            --whatsapp-muted: #667781;
            --border: #d9e2e7;
            --background: #d1d7db;
            --danger: #d93025;
            --white: #ffffff;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--background);
        }


        /* ======================================================
           PAGE
           ====================================================== */

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 18px;

            background:
                    linear-gradient(
                            to bottom,
                            #00a884 0,
                            #00a884 125px,
                            #d1d7db 125px,
                            #d1d7db 100%
                    );
        }


        /* ======================================================
           MAIN CONTAINER
           ====================================================== */

        .auth-container {
            width: 950px;
            min-height: 610px;

            display: grid;
            grid-template-columns: 42% 58%;

            background: white;

            border-radius: 8px;

            overflow: hidden;

            box-shadow:
                    0 6px 24px rgba(0, 0, 0, 0.18);
        }


        /* ======================================================
           LEFT PANEL
           ====================================================== */

        .brand-panel {
            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 50px;

            color: white;

            background:
                    radial-gradient(
                            circle at 20% 20%,
                            rgba(255,255,255,.10) 0 2px,
                            transparent 3px
                    ),
                    #00a884;
        }


        .whatsapp-logo {
            width: 85px;
            height: 85px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            color: var(--whatsapp-green);

            font-size: 38px;

            margin-bottom: 22px;
        }


        .brand-panel h1 {
            margin: 0 0 12px;

            font-size: 30px;

            font-weight: 400;
        }


        .brand-panel p {
            margin: 0;

            max-width: 280px;

            line-height: 1.6;

            color: rgba(255,255,255,.9);
        }


        .dots {
            display: flex;

            gap: 7px;

            margin-top: 30px;
        }


        .dots span {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: rgba(255,255,255,.7);
        }


        /* ======================================================
           LOGIN PANEL
           ====================================================== */

        .login-panel {
            padding: 55px 70px;

            display: flex;
            flex-direction: column;

            justify-content: center;
        }


        .mobile-brand {
            display: none;
        }


        /* ======================================================
           HEADING
           ====================================================== */

        .heading {
            margin-bottom: 28px;
        }


        .heading h2 {
            margin: 0 0 8px;

            color: var(--whatsapp-dark);

            font-size: 28px;

            font-weight: 400;
        }


        .heading p {
            margin: 0;

            color: var(--whatsapp-muted);

            font-size: 14px;
        }


        /* ======================================================
           FORM
           ====================================================== */

        .form-group {
            margin-bottom: 17px;
        }


        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #41525d;

            font-size: 13px;

            font-weight: 600;
        }


        .form-group input,
        .captcha-container input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid var(--border);

            border-radius: 4px;

            outline: none;

            color: var(--whatsapp-dark);

            font-size: 14px;

            transition:
                    border-color .15s,
                    box-shadow .15s;
        }


        .form-group input:focus,
        .captcha-container input:focus {
            border-color: var(--whatsapp-green);

            box-shadow:
                    0 0 0 2px rgba(0,168,132,.10);
        }


        /* ======================================================
           PASSWORD
           ====================================================== */

        .password-container {
            position: relative;
        }


        .password-container input {
            padding-right: 65px;
        }


        .password-container button {
            position: absolute;

            right: 8px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: var(--whatsapp-dark-green);

            cursor: pointer;

            font-weight: 600;
        }


        /* ======================================================
           ERROR
           ====================================================== */

        .form-group small,
        .captcha-container small {
            display: block;

            min-height: 15px;

            margin-top: 4px;

            color: var(--danger);

            font-size: 11px;
        }


        /* ======================================================
           CAPTCHA
           ====================================================== */

        .captcha-container {
            padding: 14px;

            margin: 5px 0 18px;

            border: 1px solid var(--border);

            border-radius: 6px;

            background: #f7f9fa;
        }


        .captcha-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;

            color: var(--whatsapp-dark);

            font-size: 13px;

            font-weight: 600;
        }


        #refreshCaptcha {
            width: 32px;
            height: 30px;

            border: 1px solid var(--border);

            border-radius: 4px;

            background: white;

            color: var(--whatsapp-dark-green);

            font-size: 20px;

            cursor: pointer;
        }


        #refreshCaptcha:hover {
            background: #eef8f5;
        }


        .captcha-image-container {
            position: relative;

            min-height: 105px;

            margin-bottom: 10px;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            border: 1px solid #e1e6e9;

            border-radius: 4px;

            background: white;
        }


        .captcha-image-container img {
            max-width: 100%;

            height: 105px;

            object-fit: contain;
        }


        #captchaLoading {
            position: absolute;

            color: var(--whatsapp-muted);

            font-size: 12px;
        }


        /* ======================================================
           MESSAGE
           ====================================================== */

        .message {
            display: none;

            margin-bottom: 15px;

            padding: 10px 12px;

            border-radius: 4px;

            font-size: 13px;

            line-height: 1.4;
        }


        .message-success {
            display: block;

            color: #075e54;

            background: #e7f8f4;
        }


        .message-error {
            display: block;

            color: #9b1c1c;

            background: #fff0f0;
        }


        /* ======================================================
           BUTTON
           ====================================================== */

        .login-button {
            width: 100%;

            padding: 13px 16px;

            border: none;

            border-radius: 4px;

            background: var(--whatsapp-green);

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;
        }


        .login-button:hover {
            background: var(--whatsapp-dark-green);
        }


        .login-button:disabled {
            opacity: .7;

            cursor: not-allowed;
        }


        /* ======================================================
           SPINNER
           ====================================================== */

        .spinner {
            display: none;

            width: 16px;
            height: 16px;

            margin-left: 7px;

            vertical-align: -3px;

            border: 2px solid rgba(255,255,255,.45);

            border-top-color: white;

            border-radius: 50%;

            animation: spin .7s linear infinite;
        }


        .login-button.loading .spinner {
            display: inline-block;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* ======================================================
           REGISTER LINK
           ====================================================== */

        .switch-account {
            margin-top: 22px;

            text-align: center;

            color: var(--whatsapp-muted);

            font-size: 13px;
        }


        .switch-account a {
            color: var(--whatsapp-dark-green);

            font-weight: 600;

            text-decoration: none;
        }


        .switch-account a:hover {
            text-decoration: underline;
        }


        /* ======================================================
           MOBILE
           ====================================================== */

        @media (max-width: 760px) {

            .page {
                padding: 0;

                background: #f0f2f5;

                align-items: stretch;
            }


            .auth-container {
                width: 100%;

                min-height: 100vh;

                display: block;

                border-radius: 0;

                box-shadow: none;
            }


            .brand-panel {
                display: none;
            }


            .login-panel {
                min-height: 100vh;

                padding: 35px 24px;

                justify-content: flex-start;
            }


            .mobile-brand {
                display: flex;

                align-items: center;
                justify-content: center;

                gap: 10px;

                margin-bottom: 40px;

                color: var(--whatsapp-dark);

                font-size: 22px;
            }


            .mobile-logo {
                width: 42px;
                height: 42px;

                display: flex;

                align-items: center;
                justify-content: center;

                border-radius: 50%;

                background: var(--whatsapp-green);

                color: white;

                font-size: 20px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <div class="auth-container">


        <!-- ==================================================
             LEFT WHATSAPP PANEL
             ================================================== -->

        <section class="brand-panel">

            <div class="whatsapp-logo">
                <span>☎</span>
            </div>

            <h1>
                WhatsApp Web
            </h1>

            <p>
                Simple, secure and reliable messaging.
            </p>

            <div class="dots">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>


        <!-- ==================================================
             LOGIN PANEL
             ================================================== -->

        <section class="login-panel">


            <div class="mobile-brand">

                <div class="mobile-logo">
                    ☎
                </div>

                <span>
                    WhatsApp
                </span>

            </div>


            <div class="heading">

                <h2>
                    Welcome back
                </h2>

                <p>
                    Login to continue to your account
                </p>

            </div>


            <!-- ==================================================
                 LOGIN FORM
                 ================================================== -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                    >

                    <small id="emailError"></small>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                        >

                        <button
                                type="button"
                                id="togglePassword"
                        >
                            Show
                        </button>

                    </div>

                    <small id="passwordError"></small>

                </div>


                <!-- CAPTCHA -->

                <div class="captcha-container">

                    <div class="captcha-header">

                        <span>
                            Security check
                        </span>

                        <button
                                type="button"
                                id="refreshCaptcha"
                        >
                            ↻
                        </button>

                    </div>


                    <div class="captcha-image-container">

                        <img
                                id="captchaImage"
                                alt="CAPTCHA"
                        >

                        <span id="captchaLoading">
                            Loading...
                        </span>

                    </div>


                    <input
                            type="text"
                            id="captchaAnswer"
                            placeholder="Enter the characters shown above"
                            autocomplete="off"
                            required
                    >


                    <input
                            type="hidden"
                            id="captchaId"
                    >


                    <small id="captchaError"></small>

                </div>


                <!-- MESSAGE -->

                <div
                        id="message"
                        class="message"
                ></div>


                <!-- LOGIN BUTTON -->

                <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                >

                    <span id="buttonText">
                        Login
                    </span>

                    <span
                            id="spinner"
                            class="spinner"
                    ></span>

                </button>

            </form>


            <!-- REGISTER -->

            <div class="switch-account">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </div>


        </section>

    </div>

</div>


<!-- ==========================================================
     JAVASCRIPT
     ========================================================== -->

<script>

    const API_BASE_URL =
        "http://localhost:8080";


    // ======================================================
    // ELEMENTS
    // ======================================================

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const captchaImage =
        document.getElementById("captchaImage");

    const captchaAnswerInput =
        document.getElementById("captchaAnswer");

    const captchaIdInput =
        document.getElementById("captchaId");

    const refreshCaptchaButton =
        document.getElementById("refreshCaptcha");

    const togglePasswordButton =
        document.getElementById("togglePassword");

    const loginButton =
        document.getElementById("loginButton");

    const buttonText =
        document.getElementById("buttonText");

    const spinner =
        document.getElementById("spinner");

    const message =
        document.getElementById("message");

    const captchaLoading =
        document.getElementById("captchaLoading");


    // ======================================================
    // CAPTCHA ID
    // ======================================================

    let captchaId = null;


    // ======================================================
    // PAGE LOAD
    // ======================================================

    document.addEventListener(
        "DOMContentLoaded",
        () => {

            generateCaptcha();

        }
    );


    // ======================================================
    // PASSWORD SHOW / HIDE
    // ======================================================

    togglePasswordButton.addEventListener(
        "click",
        () => {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePasswordButton.textContent =
                    "Hide";

            } else {

                passwordInput.type = "password";

                togglePasswordButton.textContent =
                    "Show";

            }

        }
    );


    // ======================================================
    // GENERATE CAPTCHA
    // ======================================================

    async function generateCaptcha() {

        try {

            captchaLoading.style.display =
                "block";

            captchaImage.style.display =
                "none";


            const response =
                await fetch(
                    `${API_BASE_URL}/generateImageCaptcha`,
                    {
                        method: "GET"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Unable to generate CAPTCHA."
                );

            }


            const data =
                await response.json();


            console.log(
                "CAPTCHA Response:",
                data
            );


            captchaId =
                data.captchaId;


            captchaIdInput.value =
                captchaId;


            captchaImage.src =
                data.captchaImage;


            captchaImage.onload =
                () => {

                    captchaLoading.style.display =
                        "none";

                    captchaImage.style.display =
                        "block";

                };


            captchaAnswerInput.value =
                "";


        } catch (error) {

            console.error(
                "CAPTCHA Error:",
                error
            );


            showMessage(
                error.message,
                false
            );

        }

    }


    // ======================================================
    // REFRESH CAPTCHA
    // ======================================================

    refreshCaptchaButton.addEventListener(
        "click",
        () => {

            generateCaptcha();

        }
    );


    // ======================================================
    // LOGIN
    // ======================================================

    loginForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            // ----------------------------------------------
            // CLEAR PREVIOUS ERRORS
            // ----------------------------------------------

            clearErrors();


            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;

            const captchaAnswer =
                captchaAnswerInput.value.trim();


            // ----------------------------------------------
            // VALIDATION
            // ----------------------------------------------

            if (!email) {

                showFieldError(
                    "emailError",
                    "Please enter your email."
                );

                return;

            }


            if (!password) {

                showFieldError(
                    "passwordError",
                    "Please enter your password."
                );

                return;

            }


            if (!captchaAnswer) {

                showFieldError(
                    "captchaError",
                    "Please enter the CAPTCHA."
                );

                return;

            }


            if (!captchaId) {

                showMessage(
                    "CAPTCHA is not available. Please refresh the CAPTCHA.",
                    false
                );

                return;

            }


            // ----------------------------------------------
            // START LOADING
            // ----------------------------------------------

            setLoading(true);


            try {


                // ==========================================
                // LOGIN REQUEST
                // ==========================================

                const response =
                    await fetch(
                        `${API_BASE_URL}/auth/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email:
                                email,

                                password:
                                password,

                                captchaId:
                                captchaId,

                                captchaAnswer:
                                captchaAnswer

                            })

                        }
                    );


                const responseText =
                    await response.text();


                console.log(
                    "Login HTTP Status:",
                    response.status
                );


                console.log(
                    "Login Response:",
                    responseText
                );


                // ==========================================
                // LOGIN FAILED
                // ==========================================

                if (!response.ok) {

                    let errorMessage =
                        "Login failed.";


                    try {

                        const errorData =
                            JSON.parse(
                                responseText
                            );


                        errorMessage =
                            errorData.message ||
                            errorMessage;


                    } catch {

                        if (responseText) {

                            errorMessage =
                                responseText;

                        }

                    }


                    throw new Error(
                        errorMessage
                    );

                }


                // ==========================================
                // LOGIN SUCCESS
                // ==========================================

                const data =
                    JSON.parse(
                        responseText
                    );


                console.log(
                    "Login Successful:",
                    data
                );


                // ==========================================
                // SAVE TOKENS
                // ==========================================

                localStorage.setItem(
                    "accessToken",
                    data.accessToken
                );


                localStorage.setItem(
                    "refreshToken",
                    data.refreshToken
                );


                // ==========================================
                // SAVE USER INFORMATION
                // ==========================================

                localStorage.setItem(
                    "userId",
                    data.userId
                );


                localStorage.setItem(
                    "userName",
                    data.name
                );


                localStorage.setItem(
                    "userEmail",
                    data.email
                );


                localStorage.setItem(
                    "userContact",
                    data.contact
                );


                localStorage.setItem(
                    "userRole",
                    data.role
                );


                localStorage.setItem(
                    "userStatus",
                    data.userStatus
                );


                // ==========================================
                // SUCCESS MESSAGE
                // ==========================================

                showMessage(
                    data.message ||
                    "Login Successful",
                    true
                );


                // ==========================================
                // REDIRECT
                // ==========================================

                setTimeout(
                    () => {

                        window.location.href =
                            "/templates/groupchat.html";

                    },
                    500
                );


            } catch (error) {

                console.error(
                    "Login Error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Login failed.",
                    false
                );


                // CAPTCHA is single-use,
                // so generate a new one.

                await generateCaptcha();


            } finally {

                setLoading(false);

            }

        }
    );


    // ======================================================
    // LOADING
    // ======================================================

    function setLoading(
        loading
    ) {

        loginButton.disabled =
            loading;


        if (loading) {

            buttonText.textContent =
                "Logging in...";


            spinner.style.display =
                "inline-block";


        } else {

            buttonText.textContent =
                "Login";


            spinner.style.display =
                "none";

        }

    }


    // ======================================================
    // FIELD ERROR
    // ======================================================

    function showFieldError(
        elementId,
        text
    ) {

        const element =
            document.getElementById(
                elementId
            );


        if (element) {

            element.textContent =
                text;

        }

    }


    // ======================================================
    // CLEAR ERRORS
    // ======================================================

    function clearErrors() {

        document.getElementById(
            "emailError"
        ).textContent = "";


        document.getElementById(
            "passwordError"
        ).textContent = "";


        document.getElementById(
            "captchaError"
        ).textContent = "";


        message.textContent = "";

        message.className = "message";

    }


    // ======================================================
    // MESSAGE
    // ======================================================

    function showMessage(
        text,
        success
    ) {

        message.textContent =
            text;


        message.className =
            "message";


        if (success) {

            message.classList.add(
                "message-success"
            );

        } else {

            message.classList.add(
                "message-error"
            );

        }

    }

</script>

</body>
</html>
