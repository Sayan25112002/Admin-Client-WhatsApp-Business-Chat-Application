<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>WhatsApp Public Group</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Arial,sans-serif;background:#d9dbd5;height:100vh;overflow:hidden}
        .app{height:100vh;display:flex;max-width:1500px;margin:auto;background:#fff}
        .sidebar{width:360px;border-right:1px solid #ddd;background:#fff;display:flex;flex-direction:column}
        .sidebar-header{height:70px;background:#f0f2f5;display:flex;align-items:center;padding:10px 16px;gap:12px}
        .profile-circle{width:46px;height:46px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
        .profile-info{flex:1;min-width:0}
        .profile-name{font-weight:bold;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .profile-role{font-size:12px;color:#667781;margin-top:3px}
        .header-icons{display:flex;gap:18px;font-size:22px;color:#54656f}
        .search-box{padding:8px 12px;background:#f0f2f5}
        .search-box input{width:100%;border:0;outline:0;border-radius:8px;padding:11px 14px;background:#fff;font-size:14px}
        .group-item{height:76px;padding:12px 15px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #eee;cursor:pointer}
        .group-item:hover{background:#f5f6f6}
        .group-icon{width:50px;height:50px;border-radius:50%;background:#128c7e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
        .group-info{flex:1;min-width:0}
        .group-name{font-size:16px;font-weight:500}
        .group-last{font-size:13px;color:#667781;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .group-time{font-size:11px;color:#667781;align-self:flex-start}
        .chat{flex:1;display:flex;flex-direction:column;background:#efeae2;min-width:0}
        .chat-header{height:70px;background:#f0f2f5;display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:1px solid #ddd;position:relative}
        .chat-title{flex:1;min-width:0}
        .chat-title strong{display:block;font-size:16px}
        .chat-title span{display:block;font-size:12px;color:#667781;margin-top:3px}
        .chat-icons{display:flex;gap:20px;font-size:21px;color:#54656f}
        .messages{flex:1;overflow-y:auto;padding:22px 7%;background-color:#efeae2;background-image:radial-gradient(#d8d0c5 1px,transparent 1px);background-size:20px 20px}
        .empty{height:100%;display:flex;align-items:center;justify-content:center;color:#667781;font-size:14px}
        .message-row{display:flex;margin-bottom:8px}
        .message-row.mine{justify-content:flex-end}
        .message{max-width:65%;padding:7px 9px 6px;border-radius:8px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08);position:relative}
        .message-row.mine .message{background:#d9fdd3}
        .sender{font-size:12px;font-weight:bold;color:#128c7e;margin-bottom:3px}
        .message-text{font-size:14px;line-height:20px;word-break:break-word}
        .message-time{font-size:10px;color:#667781;text-align:right;margin-top:3px}
        .system-message{text-align:center;margin:10px 0}
        .system-message span{background:#fff3c4;color:#667781;font-size:11px;padding:5px 9px;border-radius:6px}
        .input-area{min-height:65px;background:#f0f2f5;padding:10px 15px;display:flex;align-items:center;gap:10px}
        .input-area input{flex:1;border:0;outline:0;border-radius:8px;padding:12px 15px;font-size:14px}
        .send-btn{border:0;background:#128c7e;color:#fff;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px}
        .send-btn:disabled{background:#9aa5a5;cursor:not-allowed}
        .client-notice{flex:1;text-align:center;color:#667781;font-size:13px}
        .members-panel{display:none;position:absolute;right:0;top:70px;width:280px;max-height:400px;background:#fff;border:1px solid #ddd;box-shadow:0 3px 10px rgba(0,0,0,.15);z-index:10}
        .members-panel.show{display:block}
        .members-header{padding:15px;font-weight:bold;border-bottom:1px solid #eee}
        .member-list{max-height:340px;overflow-y:auto}
        .member{padding:12px 15px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}
        .member-circle{width:36px;height:36px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
        .member-name{font-size:14px}
        .member-role{font-size:11px;color:#667781;margin-top:2px}
        .status-dot{width:8px;height:8px;border-radius:50%;background:#25d366;margin-left:auto}
        .offline{background:#aaa}
        .logout-btn{border:0;background:transparent;color:#d32f2f;cursor:pointer;font-size:12px;margin-top:3px}
        @media(max-width:800px){
            .sidebar{width:100px}
            .profile-info,.search-box,.group-info,.group-time{display:none}
            .sidebar-header{justify-content:center}
            .group-item{justify-content:center}
            .chat{min-width:0}
            .messages{padding:15px 3%}
            .message{max-width:80%}
        }
        @media(max-width:550px){
            .sidebar{display:none}
            .chat{width:100%}
        }
    </style>
</head>

<body>
<div class="app">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="profile-circle" id="profileCircle">?</div>

            <div class="profile-info">
                <div class="profile-name" id="profileName">Loading...</div>
                <div class="profile-role" id="profileRole">Loading...</div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="header-icons">
                <span>＋</span>
                <span>⋮</span>
            </div>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search or start new chat">
        </div>

        <div class="group-item">
            <div class="group-icon">👥</div>

            <div class="group-info">
                <div class="group-name">Public Group</div>
                <div class="group-last" id="lastMessage">No messages yet</div>
            </div>

            <div class="group-time" id="lastTime"></div>
        </div>
    </aside>

    <main class="chat">

        <header class="chat-header">
            <div class="group-icon">👥</div>

            <div class="chat-title">
                <strong>Public Group</strong>
                <span id="memberStatus">0 members</span>
            </div>

            <div class="chat-icons">
                <span>🔍</span>
                <span onclick="toggleMembers()" style="cursor:pointer">👥</span>
            </div>

            <div class="members-panel" id="membersPanel">
                <div class="members-header">
                    Members (<span id="memberCount">0</span>)
                </div>

                <div class="member-list" id="membersList"></div>
            </div>
        </header>

        <section class="messages" id="messages">
            <div class="empty" id="emptyMessage">No messages yet</div>
        </section>

        <footer class="input-area" id="inputArea">
            <input
                    type="text"
                    id="messageInput"
                    placeholder="Type a message"
                    autocomplete="off"
                    maxlength="1000"
            >

            <button
                    class="send-btn"
                    id="sendButton"
                    onclick="sendMessage()"
            >➤</button>
        </footer>

    </main>
</div>

<script>
    const API_BASE_URL="http://localhost:8080";

    // ADJUST to match your backend refresh endpoint
    const REFRESH_TOKEN_URL=API_BASE_URL+"/refresh-token/";

    let stompClient=null;
    let connected=false;
    let connecting=false;
    let reconnectTimer=null;

    const userId=localStorage.getItem("userId");
    const userName=localStorage.getItem("userName");
    const userEmail=localStorage.getItem("userEmail");
    const userRole=localStorage.getItem("userRole");
    const userStatus=localStorage.getItem("userStatus");

    const currentUser={
        id:userId ? Number(userId):null,
        name:userName || "Unknown User",
        email:userEmail || "",
        role:userRole || "",
        status:userStatus || ""
    };

    const members=new Map();

    document.addEventListener("DOMContentLoaded",function(){
        initializeUser();
        configureUserInterface();
        connectWebSocket();

        const messageInput=document.getElementById("messageInput");

        if(messageInput){
            messageInput.addEventListener("keydown",function(event){
                if(event.key==="Enter" && !event.shiftKey){
                    event.preventDefault();
                    sendMessage();
                }
            });
        }
    });

    function initializeUser(){
        const accessToken=localStorage.getItem("accessToken");

        if(!accessToken){
            alert("Access token not found. Please login again.");
            clearLoginData();
            return;
        }

        if(!currentUser.id || !currentUser.role){
            alert("User information not found. Please login again.");
            clearLoginData();
            return;
        }

        document.getElementById("profileName").textContent=currentUser.name;
        document.getElementById("profileRole").textContent=currentUser.role;

        const firstLetter=currentUser.name.charAt(0).toUpperCase();
        document.getElementById("profileCircle").textContent=firstLetter;

        addMember({
            id:currentUser.id,
            name:currentUser.name,
            role:currentUser.role,
            status:"ONLINE"
        });
    }

    function configureUserInterface(){
        const inputArea=document.getElementById("inputArea");
        const messageInput=document.getElementById("messageInput");

        if(currentUser.role==="ADMIN"){
            inputArea.style.display="flex";

            if(messageInput){
                messageInput.disabled=false;
                messageInput.placeholder="Type a message";
            }
        }else{
            inputArea.innerHTML=
                '<div class="client-notice">Only the ADMIN can send messages to the public group.</div>';
        }
    }

    function isTokenExpired(token){
        try{
            const base64=token.split(".")[1]
                .replace(/-/g,"+")
                .replace(/_/g,"/");

            const payload=JSON.parse(atob(base64));

            // treat as expired 10 seconds early
            return payload.exp*1000<=Date.now()+10000;
        }catch(error){
            return true;
        }
    }

    async function getValidAccessToken(){
        const accessToken=localStorage.getItem("accessToken");

        if(accessToken && !isTokenExpired(accessToken)){
            return accessToken;
        }

        const refreshToken=localStorage.getItem("refreshToken");

        if(!refreshToken || isTokenExpired(refreshToken)){
            return null;
        }

        try{
            // ADJUST method / body / response fields to match your backend
            const response=await fetch(REFRESH_TOKEN_URL,{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({refreshToken:refreshToken})
            });

            if(!response.ok){
                return null;
            }

            const data=await response.json();
            const newAccessToken=data.accessToken || data.access_token || data.token;

            if(!newAccessToken){
                return null;
            }

            localStorage.setItem("accessToken",newAccessToken);

            if(data.refreshToken){
                localStorage.setItem("refreshToken",data.refreshToken);
            }

            return newAccessToken;
        }catch(error){
            console.error("Token refresh failed:",error);
            return null;
        }
    }

    async function connectWebSocket(){
        if(connecting || (stompClient && connected)){
            return;
        }

        connecting=true;

        const accessToken=await getValidAccessToken();

        if(!accessToken){
            connecting=false;
            alert("Session expired. Please login again.");
            clearLoginData();
            return;
        }

        const socket=new SockJS(API_BASE_URL+"/ws");

        stompClient=Stomp.over(socket);

        stompClient.debug=function(){};

        const headers={
            Authorization:"Bearer "+accessToken
        };

        stompClient.connect(
            headers,
            function(frame){
                connecting=false;
                connected=true;

                console.log("WebSocket connected:",frame);

                stompClient.subscribe(
                    "/topic/public",
                    function(message){
                        try{
                            const response=JSON.parse(message.body);
                            handleIncomingMessage(response);
                        }catch(error){
                            console.error(
                                "Invalid WebSocket message:",
                                error
                            );
                        }
                    }
                );

                updateConnectionStatus(true);
            },
            function(error){
                connecting=false;
                connected=false;

                console.error(
                    "WebSocket connection error:",
                    error
                );

                updateConnectionStatus(false);

                scheduleReconnect();
            }
        );
    }

    function scheduleReconnect(){
        if(reconnectTimer){
            return;
        }

        reconnectTimer=setTimeout(function(){
            reconnectTimer=null;

            if(!connected){
                connectWebSocket();
            }
        },5000);
    }

    function handleIncomingMessage(response){
        if(!response){
            return;
        }

        if(response.senderId){
            addMember({
                id:response.senderId,
                name:response.senderName || "User",
                role:response.senderRole || "CLIENT",
                status:"ONLINE"
            });
        }

        if(response.messageType==="JOIN"){
            showSystemMessage(
                response.content || "joined the chat"
            );

            updateLastMessage(
                response.content || "joined the chat",
                response.createdAt
            );

            return;
        }

        if(response.messageType==="LEFT"){
            showSystemMessage(
                response.content || "left the chat"
            );

            if(
                response.senderId &&
                Number(response.senderId)!==Number(currentUser.id)
            ){
                const member=members.get(
                    Number(response.senderId)
                );

                if(member){
                    member.status="OFFLINE";
                    addMember(member);
                }
            }

            updateLastMessage(
                response.content || "left the chat",
                response.createdAt
            );

            return;
        }

        if(response.messageType==="CHAT"){
            addChatMessage(response);

            updateLastMessage(
                response.content || "",
                response.createdAt
            );
        }
    }

    function addChatMessage(response){
        const messages=document.getElementById("messages");
        const empty=document.getElementById("emptyMessage");

        if(empty){
            empty.remove();
        }

        const row=document.createElement("div");

        const isMine=
            Number(response.senderId)===
            Number(currentUser.id);

        row.className=
            "message-row"+
            (isMine ? " mine":"");

        const message=document.createElement("div");
        message.className="message";

        if(!isMine){
            const sender=document.createElement("div");

            sender.className="sender";
            sender.textContent=
                response.senderName || "User";

            message.appendChild(sender);
        }

        const text=document.createElement("div");

        text.className="message-text";
        text.textContent=response.content || "";

        const time=document.createElement("div");

        time.className="message-time";
        time.textContent=
            formatTime(response.createdAt);

        message.appendChild(text);
        message.appendChild(time);

        row.appendChild(message);
        messages.appendChild(row);

        scrollToBottom();
    }

    function showSystemMessage(content){
        const messages=document.getElementById("messages");
        const empty=document.getElementById("emptyMessage");

        if(empty){
            empty.remove();
        }

        const wrapper=document.createElement("div");

        wrapper.className="system-message";

        const span=document.createElement("span");

        span.textContent=content;

        wrapper.appendChild(span);
        messages.appendChild(wrapper);

        scrollToBottom();
    }

    function sendMessage(){
        if(currentUser.role!=="ADMIN"){
            return;
        }

        if(!stompClient || !connected){
            alert("WebSocket is not connected.");
            return;
        }

        const input=document.getElementById("messageInput");

        if(!input){
            return;
        }

        const content=input.value.trim();

        if(!content){
            return;
        }

        const request={
            content:content
        };

        stompClient.send(
            "/app/chat.sendMessage",
            {},
            JSON.stringify(request)
        );

        input.value="";
        input.focus();
    }

    function addMember(member){
        if(!member || !member.id){
            return;
        }

        members.set(
            Number(member.id),
            {
                id:Number(member.id),
                name:member.name || "User",
                role:member.role || "CLIENT",
                status:member.status || "ONLINE"
            }
        );

        renderMembers();
    }

    function renderMembers(){
        const list=document.getElementById("membersList");
        const count=document.getElementById("memberCount");
        const status=document.getElementById("memberStatus");

        list.innerHTML="";

        members.forEach(function(member){
            const item=document.createElement("div");

            item.className="member";

            const circle=document.createElement("div");

            circle.className="member-circle";

            circle.textContent=
                (member.name || "?")
                    .charAt(0)
                    .toUpperCase();

            const info=document.createElement("div");

            info.style.flex="1";

            const name=document.createElement("div");

            name.className="member-name";
            name.textContent=member.name;

            const role=document.createElement("div");

            role.className="member-role";
            role.textContent=member.role;

            info.appendChild(name);
            info.appendChild(role);

            const dot=document.createElement("div");

            dot.className=
                "status-dot"+
                (member.status==="ONLINE"
                    ? ""
                    : " offline");

            item.appendChild(circle);
            item.appendChild(info);
            item.appendChild(dot);

            list.appendChild(item);
        });

        count.textContent=members.size;

        status.textContent=
            members.size+
            " member"+
            (members.size===1 ? "" : "s");
    }

    function updateLastMessage(message,time){
        document.getElementById("lastMessage").textContent=
            message || "No messages yet";

        document.getElementById("lastTime").textContent=
            formatTime(time);
    }

    function updateConnectionStatus(isConnected){
        const status=
            document.getElementById("memberStatus");

        if(!isConnected){
            status.textContent="Connecting...";
        }else{
            status.textContent=
                members.size+
                " member"+
                (members.size===1 ? "" : "s");
        }
    }

    function formatTime(dateTime){
        if(!dateTime){
            return "";
        }

        const date=new Date(dateTime);

        if(isNaN(date.getTime())){
            return "";
        }

        return date.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
    }

    function scrollToBottom(){
        const messages=
            document.getElementById("messages");

        messages.scrollTop=
            messages.scrollHeight;
    }

    function toggleMembers(){
        document
            .getElementById("membersPanel")
            .classList.toggle("show");
    }

    function logout(){
        if(stompClient && connected){
            stompClient.disconnect(function(){
                clearLoginData();
            });
        }else{
            clearLoginData();
        }
    }

    function clearLoginData(){
        if(reconnectTimer){
            clearTimeout(reconnectTimer);
            reconnectTimer=null;
        }

        localStorage.removeItem("accessToken");
        localStorage.removeItem("refreshToken");
        localStorage.removeItem("userId");
        localStorage.removeItem("userName");
        localStorage.removeItem("userEmail");
        localStorage.removeItem("userContact");
        localStorage.removeItem("userRole");
        localStorage.removeItem("userStatus");

        window.location.href="/login";
    }

    window.addEventListener(
        "beforeunload",
        function(){
            if(stompClient && connected){
                stompClient.disconnect();
            }
        }
    );
</script>
</body>
</html>
