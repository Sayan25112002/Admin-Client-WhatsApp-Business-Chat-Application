<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Video Call</title>

    <style>
        *{
            box-sizing:border-box;
        }

        html,body{
            width:100%;
            height:100%;
            margin:0;
            overflow:hidden;
            font-family:Arial,sans-serif;
            background:#111b21;
            color:#fff;
        }

        body{
            display:flex;
            flex-direction:column;
        }

        .call-header{
            height:64px;
            background:#202c33;
            display:flex;
            align-items:center;
            padding:0 20px;
            flex-shrink:0;
            border-bottom:1px solid #344047;
        }

        .call-info{
            display:flex;
            align-items:center;
            gap:12px;
            min-width:0;
        }

        .call-avatar{
            width:42px;
            height:42px;
            border-radius:50%;
            background:#25d366;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:18px;
            font-weight:bold;
            flex-shrink:0;
        }

        .call-title{
            min-width:0;
        }

        .call-title strong{
            display:block;
            font-size:15px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .call-title span{
            display:block;
            color:#aebac1;
            font-size:12px;
            margin-top:3px;
        }

        .call-type{
            margin-left:auto;
            color:#aebac1;
            font-size:12px;
        }

        .video-area{
            flex:1;
            position:relative;
            overflow:hidden;
            background:#0b141a;
            padding:16px;
        }

        .video-grid{
            width:100%;
            height:100%;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            grid-auto-rows:minmax(220px,1fr);
            gap:12px;
            align-items:center;
            justify-items:center;
        }

        .video-card{
            position:relative;
            width:100%;
            height:100%;
            min-height:220px;
            background:#202c33;
            border-radius:10px;
            overflow:hidden;
            border:1px solid #344047;
        }

        .video-card video{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
            background:#111;
        }

        .video-placeholder{
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#202c33;
        }

        .placeholder-avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#128c7e;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:34px;
            font-weight:bold;
        }

        .video-label{
            position:absolute;
            left:12px;
            bottom:10px;
            padding:6px 9px;
            border-radius:5px;
            background:rgba(0,0,0,.55);
            font-size:12px;
            max-width:75%;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }

        .video-status{
            position:absolute;
            right:10px;
            top:10px;
            width:30px;
            height:30px;
            border-radius:50%;
            background:rgba(0,0,0,.55);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:14px;
        }

        .local-video{
            position:absolute;
            right:24px;
            bottom:24px;
            width:220px;
            height:145px;
            border-radius:10px;
            overflow:hidden;
            border:2px solid rgba(255,255,255,.35);
            background:#202c33;
            z-index:5;
            box-shadow:0 5px 20px rgba(0,0,0,.4);
        }

        .local-video video{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }

        .local-label{
            position:absolute;
            left:8px;
            bottom:7px;
            background:rgba(0,0,0,.55);
            padding:4px 7px;
            border-radius:4px;
            font-size:11px;
        }

        .waiting-screen{
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:10px;
            background:#0b141a;
            z-index:2;
        }

        .waiting-icon{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#128c7e;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:38px;
        }

        .waiting-title{
            font-size:18px;
            font-weight:bold;
        }

        .waiting-text{
            color:#aebac1;
            font-size:13px;
        }

        .call-controls{
            height:90px;
            background:#202c33;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:18px;
            flex-shrink:0;
            border-top:1px solid #344047;
        }

        .control-btn{
            width:52px;
            height:52px;
            border:0;
            border-radius:50%;
            background:#3b4a52;
            color:#fff;
            font-size:21px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:.15s;
        }

        .control-btn:hover{
            background:#52636c;
        }

        .control-btn.active{
            background:#667781;
        }

        .control-btn.muted{
            background:#ea0038;
        }

        .end-call{
            width:58px;
            height:52px;
            border:0;
            border-radius:26px;
            background:#ea0038;
            color:#fff;
            font-size:22px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .end-call:hover{
            background:#c90030;
        }

        .status-bar{
            position:absolute;
            top:78px;
            left:50%;
            transform:translateX(-50%);
            z-index:10;
            padding:7px 14px;
            border-radius:18px;
            background:rgba(32,44,51,.85);
            color:#d9e1e5;
            font-size:12px;
            pointer-events:none;
        }

        .connection-dot{
            display:inline-block;
            width:7px;
            height:7px;
            border-radius:50%;
            background:#25d366;
            margin-right:5px;
        }

        .connection-dot.disconnected{
            background:#ea0038;
        }

        .participant-count{
            position:absolute;
            left:20px;
            bottom:24px;
            z-index:6;
            background:rgba(0,0,0,.55);
            padding:7px 11px;
            border-radius:16px;
            color:#d9e1e5;
            font-size:12px;
        }

        @media(max-width:800px){

            .video-area{
                padding:8px;
            }

            .video-grid{
                grid-template-columns:repeat(
                    auto-fit,
                    minmax(180px,1fr)
                );
                gap:8px;
            }

            .video-card{
                min-height:170px;
            }

            .local-video{
                width:145px;
                height:100px;
                right:12px;
                bottom:15px;
            }

            .participant-count{
                left:12px;
                bottom:15px;
            }

            .call-controls{
                height:80px;
                gap:12px;
            }

            .control-btn{
                width:46px;
                height:46px;
                font-size:18px;
            }

            .end-call{
                width:52px;
                height:46px;
            }
        }

        @media(max-width:500px){

            .call-header{
                height:58px;
                padding:0 12px;
            }

            .call-avatar{
                width:36px;
                height:36px;
            }

            .call-title strong{
                font-size:14px;
            }

            .call-type{
                display:none;
            }

            .video-area{
                padding:5px;
            }

            .video-grid{
                grid-template-columns:1fr;
                grid-auto-rows:1fr;
            }

            .video-card{
                min-height:160px;
            }

            .local-video{
                width:120px;
                height:85px;
                right:8px;
                bottom:10px;
            }

            .participant-count{
                left:8px;
                bottom:10px;
            }

            .call-controls{
                height:75px;
                gap:8px;
            }

            .control-btn{
                width:42px;
                height:42px;
            }

            .end-call{
                width:48px;
                height:42px;
            }
        }
    </style>
</head>

<body>

<header class="call-header">

    <div class="call-info">

        <div
                class="call-avatar"
                id="callAvatar">
            👥
        </div>

        <div class="call-title">

            <strong id="callTitle">
                Public Group
            </strong>

            <span id="callSubtitle">
                Connecting...
            </span>

        </div>

    </div>

    <div
            class="call-type"
            id="callType">
        Group video call
    </div>

</header>

<main class="video-area">

    <div
            class="status-bar"
            id="connectionStatus">

        <span class="connection-dot"></span>
        Connecting...

    </div>

    <div
            class="video-grid"
            id="videoGrid">

        <!-- Remote videos are added here dynamically -->

    </div>

    <div
            class="waiting-screen"
            id="waitingScreen">

        <div
                class="waiting-icon"
                id="waitingIcon">
            👥
        </div>

        <div
                class="waiting-title"
                id="waitingTitle">
            Starting video call
        </div>

        <div
                class="waiting-text"
                id="waitingText">
            Please wait...
        </div>

    </div>

    <div class="local-video">

        <video
                id="localVideo"
                autoplay
                muted
                playsinline>
        </video>

        <div
                class="local-label"
                id="localLabel">
            You
        </div>

    </div>

    <div
            class="participant-count"
            id="participantCount">
        1 participant
    </div>

</main>

<footer class="call-controls">

    <button
            class="control-btn"
            id="micButton"
            title="Mute microphone"
            onclick="toggleMicrophone()">
        🎤
    </button>

    <button
            class="control-btn"
            id="cameraButton"
            title="Turn off camera"
            onclick="toggleCamera()">
        📹
    </button>

    <button
            class="end-call"
            title="Leave call"
            onclick="endCall()">
        📞
    </button>

</footer>

<script>

    /*
     * ============================================================
     * CALL MODE
     * ============================================================
     */

    const videoCallMode=
        sessionStorage.getItem(
            "videoCallMode"
        ) || "group";

    const callMode=
        sessionStorage.getItem(
            "callMode"
        ) || "start";

    const currentUserId=
        Number(
            sessionStorage.getItem(
                "callUserId"
            ) ||
            sessionStorage.getItem(
                "userId"
            )
        );

    const currentUserName=
        sessionStorage.getItem(
            "callUserName"
        ) ||
        sessionStorage.getItem(
            "userName"
        ) ||
        "You";

    const peerId=
        Number(
            sessionStorage.getItem(
                "videoCallPeerId"
            )
        ) || null;

    const peerName=
        sessionStorage.getItem(
            "videoCallPeerName"
        ) ||
        "User";


    /*
     * ============================================================
     * PAGE INITIALIZATION
     * ============================================================
     */

    const callTitle=
        document.getElementById(
            "callTitle"
        );

    const callSubtitle=
        document.getElementById(
            "callSubtitle"
        );

    const callType=
        document.getElementById(
            "callType"
        );

    const callAvatar=
        document.getElementById(
            "callAvatar"
        );

    const waitingIcon=
        document.getElementById(
            "waitingIcon"
        );

    const waitingTitle=
        document.getElementById(
            "waitingTitle"
        );

    const waitingText=
        document.getElementById(
            "waitingText"
        );

    const localLabel=
        document.getElementById(
            "localLabel"
        );


    if(videoCallMode==="private"){

        callTitle.textContent=
            peerName;

        callSubtitle.textContent=
            "Private video call";

        callType.textContent=
            "Private video call";

        callAvatar.textContent=
            peerName
                .charAt(0)
                .toUpperCase();

        waitingIcon.textContent=
            peerName
                .charAt(0)
                .toUpperCase();

        waitingTitle.textContent=
            callMode==="private"
                ? "Calling "+peerName
                : "Connecting to "+peerName;

        waitingText.textContent=
            "Waiting for the other participant...";

    }else{

        callTitle.textContent=
            "Public Group";

        callSubtitle.textContent=
            "Group video call";

        callType.textContent=
            "Group video call";

        callAvatar.textContent=
            "👥";

        waitingIcon.textContent=
            "👥";

        waitingTitle.textContent=
            callMode==="start"
                ? "Starting group video call"
                : "Joining group video call";

        waitingText.textContent=
            "Waiting for participants...";

    }

    localLabel.textContent=
        currentUserName;


    /*
     * ============================================================
     * LOCAL MEDIA
     * ============================================================
     */

    let localStream=null;

    let microphoneEnabled=true;
    let cameraEnabled=true;


    async function startLocalMedia(){

        try{

            localStream=
                await navigator.mediaDevices.getUserMedia({
                    video:true,
                    audio:true
                });

            const localVideo=
                document.getElementById(
                    "localVideo"
                );

            localVideo.srcObject=
                localStream;

            updateWaitingScreen();

            return true;

        }catch(error){

            console.error(
                "Camera/microphone error:",
                error
            );

            waitingTitle.textContent=
                "Camera access required";

            waitingText.textContent=
                "Please allow camera and microphone permission.";

            return false;

        }

    }


    /*
     * ============================================================
     * MICROPHONE
     * ============================================================
     */

    function toggleMicrophone(){

        if(!localStream){
            return;
        }

        const tracks=
            localStream.getAudioTracks();

        if(!tracks.length){
            return;
        }

        microphoneEnabled=
            !microphoneEnabled;

        tracks.forEach(
            function(track){

                track.enabled=
                    microphoneEnabled;

            }
        );

        const button=
            document.getElementById(
                "micButton"
            );

        if(microphoneEnabled){

            button.textContent="🎤";
            button.title=
                "Mute microphone";

            button.classList.remove(
                "muted"
            );

        }else{

            button.textContent="🔇";
            button.title=
                "Unmute microphone";

            button.classList.add(
                "muted"
            );

        }

    }


    /*
     * ============================================================
     * CAMERA
     * ============================================================
     */

    function toggleCamera(){

        if(!localStream){
            return;
        }

        const tracks=
            localStream.getVideoTracks();

        if(!tracks.length){
            return;
        }

        cameraEnabled=
            !cameraEnabled;

        tracks.forEach(
            function(track){

                track.enabled=
                    cameraEnabled;

            }
        );

        const button=
            document.getElementById(
                "cameraButton"
            );

        if(cameraEnabled){

            button.textContent="📹";
            button.title=
                "Turn off camera";

            button.classList.remove(
                "muted"
            );

        }else{

            button.textContent="🚫";
            button.title=
                "Turn on camera";

            button.classList.add(
                "muted"
            );

        }

    }


    /*
     * ============================================================
     * PARTICIPANT UI
     * ============================================================
     */

    const remoteParticipants=
        new Map();


    function createParticipantVideo(
        participantId,
        participantName
    ){

        participantId=
            Number(participantId);

        if(
            remoteParticipants.has(
                participantId
            )
        ){

            return remoteParticipants.get(
                participantId
            );

        }

        const card=
            document.createElement(
                "div"
            );

        card.className=
            "video-card";

        card.id=
            "participant-"+participantId;


        const video=
            document.createElement(
                "video"
            );

        video.autoplay=true;
        video.playsInline=true;


        const placeholder=
            document.createElement(
                "div"
            );

        placeholder.className=
            "video-placeholder";

        const avatar=
            document.createElement(
                "div"
            );

        avatar.className=
            "placeholder-avatar";

        avatar.textContent=
            (
                participantName ||
                "?"
            )
                .charAt(0)
                .toUpperCase();

        placeholder.appendChild(
            avatar
        );


        const label=
            document.createElement(
                "div"
            );

        label.className=
            "video-label";

        label.textContent=
            participantName ||
            "Participant";


        const status=
            document.createElement(
                "div"
            );

        status.className=
            "video-status";

        status.textContent=
            "🎤";


        card.appendChild(
            placeholder
        );

        card.appendChild(
            video
        );

        card.appendChild(
            label
        );

        card.appendChild(
            status
        );


        document.getElementById(
            "videoGrid"
        ).appendChild(
            card
        );


        const participant={
            id:participantId,
            name:participantName,
            card:card,
            video:video,
            placeholder:placeholder,
            status:status,
            stream:null
        };


        remoteParticipants.set(
            participantId,
            participant
        );


        updateParticipantCount();

        updateWaitingScreen();

        return participant;

    }


    function removeParticipant(
        participantId
    ){

        participantId=
            Number(participantId);

        const participant=
            remoteParticipants.get(
                participantId
            );

        if(!participant){
            return;
        }

        participant.card.remove();

        remoteParticipants.delete(
            participantId
        );

        updateParticipantCount();

        updateWaitingScreen();

    }


    function setRemoteStream(
        participantId,
        stream
    ){

        const participant=
            remoteParticipants.get(
                Number(participantId)
            );

        if(!participant){
            return;
        }

        participant.stream=
            stream;

        participant.video.srcObject=
            stream;

        participant.video.style.display=
            "block";

        participant.placeholder.style.display=
            "none";

    }


    function updateParticipantCount(){

        let count=
            remoteParticipants.size+1;

        document.getElementById(
            "participantCount"
        ).textContent=
            count+
            " participant"+
            (
                count===1
                    ? ""
                    : "s"
            );

    }


    function updateWaitingScreen(){

        const waitingScreen=
            document.getElementById(
                "waitingScreen"
            );

        if(
            remoteParticipants.size>0
        ){

            waitingScreen.style.display=
                "none";

        }else{

            waitingScreen.style.display=
                "flex";

        }

    }


    /*
     * ============================================================
     * CONNECTION STATUS
     * ============================================================
     */

    function setConnectionStatus(
        connected,
        message
    ){

        const status=
            document.getElementById(
                "connectionStatus"
            );

        const dot=
            status.querySelector(
                ".connection-dot"
            );

        dot.classList.toggle(
            "disconnected",
            !connected
        );

        status.lastChild.textContent=
            " "+
            (
                message ||
                (
                    connected
                        ? "Connected"
                        : "Disconnected"
                )
            );

    }


    /*
     * ============================================================
     * END CALL
     * ============================================================
     */

    function endCall(){

        const confirmEnd=
            confirm(
                "Leave the video call?"
            );

        if(!confirmEnd){
            return;
        }

        cleanupMedia();

        /*
         * The actual WebSocket/WebRTC end-call
         * signaling can be connected here.
         */

        sessionStorage.removeItem(
            "videoCallMode"
        );

        sessionStorage.removeItem(
            "callMode"
        );

        sessionStorage.removeItem(
            "videoCallPeerId"
        );

        sessionStorage.removeItem(
            "videoCallPeerName"
        );

        sessionStorage.removeItem(
            "videoCallPeerRole"
        );

        sessionStorage.removeItem(
            "callUserId"
        );

        sessionStorage.removeItem(
            "callUserName"
        );

        window.location.href=
            "groupchat.html";

    }


    function cleanupMedia(){

        if(!localStream){
            return;
        }

        localStream.getTracks().forEach(
            function(track){

                track.stop();

            }
        );

        localStream=null;

        const localVideo=
            document.getElementById(
                "localVideo"
            );

        localVideo.srcObject=null;

    }


    /*
     * ============================================================
     * START
     * ============================================================
     */

    async function initializeCall(){

        setConnectionStatus(
            false,
            "Connecting..."
        );

        const mediaReady=
            await startLocalMedia();

        if(!mediaReady){
            return;
        }

        setConnectionStatus(
            true,
            "Connected"
        );

        if(videoCallMode==="private"){

            callSubtitle.textContent=
                "Calling "+peerName;

        }else{

            callSubtitle.textContent=
                "Group video call";

        }

    }


    initializeCall();


    window.addEventListener(
        "beforeunload",
        function(){

            cleanupMedia();

        }
    );

</script>

</body>
</html>
